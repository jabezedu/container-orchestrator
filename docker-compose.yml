version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: orchestrator_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestrator
    ports:
      - "5450:5432"
    volumes:
      - orchestrator_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrator"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orchestrator_backend
    environment:
      PORT: 4010
      DATABASE_URL: postgres://postgres:postgres@db:5432/orchestrator
      JWT_SECRET: supersecret_orchestrator_jwt_key_2026
      CORS_ORIGIN: http://localhost:3010
      TICK_MS: 1000
    ports:
      - "4010:4010"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4010
    container_name: orchestrator_frontend
    ports:
      - "3010:3010"
    depends_on:
      - backend

volumes:
  orchestrator_pgdata:
